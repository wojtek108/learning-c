<title>Reference Sheets</title>
<style>
  :root {
    --ink: #1f2933;
    --muted: #5b6770;
    --paper: #fbfaf7;
    --rule: #e3ddd2;
    --accent: #0f766e;
    --accent-soft: #e6f2f0;
    --code-bg: #f4f1ea;
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.6;
    margin: 0 auto;
    padding: 2.5rem clamp(1rem, 5vw, 4rem);
    max-width: 820px;
  }
  header { border-bottom: 2px solid var(--ink); padding-bottom: 1rem; margin-bottom: 2rem; }
  h1 { font-size: 1.9rem; margin: 0; line-height: 1.2; }
  .lede { font-size: 1.1rem; color: var(--muted); margin: 0.8rem 0 0; }
  ul { list-style: none; padding: 0; margin: 1rem 0 2rem; }
  ul li {
    padding: 0.9rem 1.1rem;
    border: 1px solid var(--rule);
    border-radius: 8px;
    margin-bottom: 0.6rem;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  ul li:hover {
    border-color: var(--accent);
    box-shadow: 0 2px 8px rgba(15, 118, 110, 0.08);
  }
  ul a {
    text-decoration: none;
    color: var(--ink);
    display: block;
  }
  .title { font-size: 1.1rem; font-weight: 600; margin: 0.15rem 0; }
  .desc { font-size: 0.88rem; color: var(--muted); margin: 0; }
  .nav { font-size: 0.85rem; margin-bottom: 1.5rem; }
  .nav a { color: var(--muted); text-decoration: none; }
</style>
